{% extends 'base.html' %}

{% block title %}
  Page Not Found | {{ block.super }}
{% endblock %}

{% block content %}
<div class="container min-vh-100 py-5 d-flex align-items-center justify-content-center">
  <div class="row justify-content-center text-center">
    <div class="col-md-8 col-lg-6">
      <div class="display-1 fw-bold text-primary mb-3">404</div>
      <h1 class="h3 mb-3">Page Not Found</h1>
      <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved. Please check the URL or return to the homepage.</p>
      <a href="/" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Go Back Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
