<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/style.css" />

    <title>
      {% block title %}
        {{ appTitle }} 
      {% endblock %}

    </title>
  </head>
  <body>
    {% include 'navbar.html' %}

    <main class="my-5 py-3">
      {% block content %}
      {% endblock %}
    </main>
    


{% include 'footer.html' %}
  


    <!-- Theme Switcher -->

      </symbol>

      </symbol>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="dropdown" aria-label="Toggle theme (dark)">
          <svg class="bi theme-icon-active" aria-hidden="true" style="width: 1rem; height: 1rem;">
            <use href="#moon-stars-fill"></use>
          </svg> <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
              <svg class="bi me-2 opacity-50" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#sun-fill"></use>
              </svg>Light<svg class="bi ms-auto d-none" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="dark" aria-pressed="true">
              <svg class="bi me-2 opacity-50" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#moon-stars-fill"></use>
              </svg>Dark<svg class="bi ms-auto d-none" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="false">
              <svg class="bi me-2 opacity-50" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#circle-half"></use>
              </svg>Auto<svg class="bi ms-auto d-none" aria-hidden="true" style="width: 1rem; height: 1rem;">
                <use href="#check2"></use>
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-drawer-backdrop" id="cartDrawerBackdrop"></div>
    <div class="cart-drawer" id="cartDrawer">
      <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
        <h2 class="h5 mb-0">Shopping Cart</h2>
        <button type="button" class="btn-close" id="closeCartDrawer" aria-label="Close"></button>
      </div>
      <div class="flex-grow-1 overflow-auto p-3" id="cartDrawerBody">
        <div class="text-center py-5">
          <i class="bi bi-cart display-4 text-muted mb-3"></i>
          <p class="text-muted">Your cart is empty</p>
           <a href="/products" class="btn btn-primary btn-sm">Continue Shopping</a>
        </div>
      </div>
      <div class="p-3 border-top" id="cartDrawerFooter" style="display: none;">
        <div class="d-flex justify-content-between mb-3">
          <span class="fw-semibold">Subtotal:</span>
          <span class="fw-semibold" id="cartSubtotal">$0.00</span>
        </div>
        <div class="d-grid gap-2">
          <a href="/products/cart/items" class="btn btn-outline-primary">View Full Cart</a>
          <a href="/products/checkout" class="btn btn-primary">Proceed to Checkout</a>
        </div>
      </div>
    </div>

    <script>
      (() => {
        'use strict'
        const cartDrawer = document.getElementById('cartDrawer')
        const cartDrawerBackdrop = document.getElementById('cartDrawerBackdrop')
        const closeCartDrawer = document.getElementById('closeCartDrawer')
        const cartDrawerBody = document.getElementById('cartDrawerBody')
        const cartDrawerFooter = document.getElementById('cartDrawerFooter')
        const cartSubtotal = document.getElementById('cartSubtotal')

        function renderCartDrawer(cart) {
          if (!cart || cart.items.length === 0) {
            cartDrawerBody.innerHTML = `
              <div class="text-center py-5">
                <i class="bi bi-cart display-4 text-muted mb-3"></i>
                <p class="text-muted">Your cart is empty</p>
                <a href="/products" class="btn btn-primary btn-sm">Continue Shopping</a>
              </div>
            `
            cartDrawerFooter.style.display = 'none'
            return
          }

          const itemsHtml = cart.items.map(item => `
            <div class="d-flex align-items-center gap-2 mb-3 pb-3 border-bottom">
              <img src="${item.image}" alt="${item.name}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;" onerror="this.src='/images/product-placeholder.png'" />
              <div class="flex-grow-1">
                <a href="/products/${item.productId}" class="text-decoration-none fw-semibold small">${item.name}</a>
                <p class="text-muted small mb-0">Qty: ${item.quantity} x $${item.price}</p>
              </div>
              <div class="text-end">
                <span class="fw-semibold small">$${item.total}</span>
              </div>
            </div>
          `).join('')

          cartDrawerBody.innerHTML = itemsHtml
          cartSubtotal.textContent = '$' + cart.subtotal
          cartDrawerFooter.style.display = 'block'
        }

        async function loadCart() {
          try {
            const response = await fetch('/products/cart/items', {
              headers: {
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
              }
            })
            const cart = await response.json()
            renderCartDrawer(cart)
          } catch (error) {
            console.error('Failed to load cart:', error)
          }
        }

        function openCartDrawer() {
          loadCart()
          cartDrawer.classList.add('open')
          cartDrawerBackdrop.classList.add('open')
          document.body.style.overflow = 'hidden'
        }

        function closeCartDrawerFn() {
          cartDrawer.classList.remove('open')
          cartDrawerBackdrop.classList.remove('open')
          document.body.style.overflow = ''
        }

        if (closeCartDrawer) {
          closeCartDrawer.addEventListener('click', closeCartDrawerFn)
        }
        if (cartDrawerBackdrop) {
          cartDrawerBackdrop.addEventListener('click', closeCartDrawerFn)
        }

        window.openCartDrawer = openCartDrawer

        const openCartDrawerBtn = document.getElementById('openCartDrawerBtn')
        if (openCartDrawerBtn) {
          openCartDrawerBtn.addEventListener('click', openCartDrawer)
        }

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeCartDrawerFn()
        })
      })()
    </script>

    {% block scripts %}{% endblock %}

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
      (() => {
        'use strict'

        const getStoredTheme = () => localStorage.getItem('theme')
        const setStoredTheme = (theme) => localStorage.setItem('theme', theme)

        const getPreferredTheme = () => {
          const storedTheme = getStoredTheme()
          if (storedTheme) {
            return storedTheme
          }
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        const setTheme = (theme) => {
          if (theme === 'auto') {
            document.documentElement.setAttribute('data-bs-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          } else {
            document.documentElement.setAttribute('data-bs-theme', theme)
          }
        }

        setTheme(getPreferredTheme())

        const showActiveTheme = (theme, focus = false) => {
          const themeSwitcher = document.querySelector('#bd-theme')
          if (!themeSwitcher) {
            return
          }

          const themeSwitcherText = document.querySelector('#bd-theme-text')
          const activeThemeIcon = document.querySelector('.theme-icon-active use')
          const btnToActive = document.querySelector('[data-bs-theme-value="' + theme + '"]')
          const svgOfActiveBtn = btnToActive.querySelector('svg use').getAttribute('href')

          document.querySelectorAll('[data-bs-theme-value]').forEach((element) => {
            element.classList.remove('active')
            element.setAttribute('aria-pressed', 'false')
          })

          btnToActive.classList.add('active')
          btnToActive.setAttribute('aria-pressed', 'true')
          activeThemeIcon.setAttribute('href', svgOfActiveBtn)
          const themeSwitcherLabel = themeSwitcherText.textContent + ' (' + theme + ')'
          themeSwitcher.setAttribute('aria-label', themeSwitcherLabel)

          if (focus) {
            themeSwitcher.focus()
          }
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          const storedTheme = getStoredTheme()
          if (storedTheme !== 'light' && storedTheme !== 'dark') {
            setTheme(getPreferredTheme())
          }
        })

        window.addEventListener('DOMContentLoaded', () => {
          showActiveTheme(getPreferredTheme())

          document.querySelectorAll('[data-bs-theme-value]').forEach((toggle) => {
            toggle.addEventListener('click', () => {
              const theme = toggle.getAttribute('data-bs-theme-value')
              setStoredTheme(theme)
              setTheme(theme)
              showActiveTheme(theme, true)
            })
          })
        })
      })()
    </script>
  </body>
</html>
